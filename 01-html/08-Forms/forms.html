<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forms — Practice</title>
</head>

<body>

    <h1>HTML Forms — Implementation Examples</h1>

    <hr>

    <form action="#" method="POST">

        <!-- Personal info -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="e.g. Nishanth" required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="e.g. P" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="9876543210">

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="13" max="120">
        </fieldset>

        <!-- Account details -->
        <fieldset>
            <legend>Account Setup</legend>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" placeholder="Letters, numbers, underscore" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>

            <label for="portfolio">Portfolio URL:</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://your-site.com">
        </fieldset>

        <!-- Preferences -->
        <fieldset>
            <legend>Preferences</legend>

            <label>Experience Level:</label>
            <input type="radio" id="fresher" name="experience" value="fresher">
            <label for="fresher">Fresher</label>

            <input type="radio" id="junior" name="experience" value="junior">
            <label for="junior">1-2 years</label>

            <input type="radio" id="mid" name="experience" value="mid">
            <label for="mid">3-5 years</label>

            <label for="branch">Branch of Study:</label>
            <select id="branch" name="branch">
                <option value="">-- Select Branch --</option>
                <option value="cse">Computer Science</option>
                <option value="ece">Electronics</option>
                <option value="eee">Electrical</option>
                <option value="mech">Mechanical</option>
                <option value="civil">Civil</option>
            </select>

            <label for="theme-color">Favorite Theme Color:</label>
            <input type="color" id="theme-color" name="theme-color" value="#3498db">

            <label for="confidence">Confidence in HTML (1-10):</label>
            <input type="range" id="confidence" name="confidence" min="1" max="10" step="1">

            <label for="editor">Preferred Code Editor:</label>
            <input type="text" id="editor" name="editor" list="editors" placeholder="Start typing...">
            <datalist id="editors">
                <option value="VS Code">
                <option value="IntelliJ IDEA">
                <option value="Sublime Text">
                <option value="Vim">
                <option value="WebStorm">
            </datalist>
        </fieldset>

        <!-- Skills checkboxes -->
        <fieldset>
            <legend>Skills (check all that apply)</legend>

            <input type="checkbox" id="skill-html" name="skills" value="html">
            <label for="skill-html">HTML</label><br>

            <input type="checkbox" id="skill-css" name="skills" value="css">
            <label for="skill-css">CSS</label><br>

            <input type="checkbox" id="skill-js" name="skills" value="js">
            <label for="skill-js">JavaScript</label><br>

            <input type="checkbox" id="skill-java" name="skills" value="java">
            <label for="skill-java">Java</label><br>

            <input type="checkbox" id="skill-sql" name="skills" value="sql">
            <label for="skill-sql">SQL</label>
        </fieldset>

        <!-- File upload and message -->
        <fieldset>
            <legend>Additional</legend>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

            <label for="message">Anything else you'd like to share?</label>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Write here..."></textarea>
        </fieldset>

        <!-- Agreement -->
        <fieldset>
            <legend>Agreement</legend>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </fieldset>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Clear Form</button>

    </form>

</body>

</html>
