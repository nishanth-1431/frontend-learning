<!DOCTYPE html>
<html>
    <head>
        <title>Login page</title>
        <link rel="icon" href="login.png">

    </head>
    <body>
        <center>
        <h1><a href="login.html">Login</a></h1>
        <hr>
        <form action="#" method="POST">
            <fieldset>
                <table>
                <tr>
                  <td><label for="email">enter your Email      </label></td>
                 <td><input type="text" id="email" name="email" placeholder="ends with @gmail.com" required><br></td>
                </tr>
                <tr>
                <td><label for="password">enter your password </label></td>
                <td><input type="password" id="password" name="password" placeholder="password here" required></td>
                </tr>
                <tr><td><small><a href="">Forgot password ?</a></small></td></tr>
                <tr>
                   <td colspan="2" align="center"><button>Login</button></td> 
                </tr>
                <tr><td colspan="2" align="center"><small>not a member? <a href="">signup</a></small></td></tr>
                </table>
            </fieldset>
        </form>
        </center>
    </body>
</html>
