<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="icon" href="login.png">
</head>

<body>

    <header>
        <h1>
            <a href="login.html">Login</a>
        </h1>
    </header>

    <hr>

    <main>

        <form action="#" method="POST">

            <fieldset>

                <legend>Login</legend>

                <table>

                    <tr>
                        <td>
                            <label for="email">Enter your email:</label>
                        </td>

                        <td>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">Enter your password:</label>
                        </td>

                        <td>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <a href="#">Forgot password?</a>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <button type="submit">Login</button>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2">
                            <small>
                                Not a member?
                                <a href="#">Sign up</a>
                            </small>
                        </td>
                    </tr>

                </table>

            </fieldset>

        </form>

    </main>

</body>

</html>
